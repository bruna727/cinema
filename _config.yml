
title: My Film Journal
description: Film reviews, personal rankings, and thoughts on cinema.
theme: minima
url: "https://bruna727.github.io"
baseurl: "/cinema"

collections:
  films:
    output: true
    permalink: /films/:name/
  rankings:
    output: true
    permalink: /rankings/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
