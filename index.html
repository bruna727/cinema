
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Film Journal</title>
  <style>
    body {
      margin: 0;
      background: #17131b;
      color: #f8edf2;
      font-family: Georgia, serif;
    }
    header {
      padding: 25px 8%;
      border-bottom: 1px solid #50404d;
      font-size: 22px;
    }
    main {
      max-width: 900px;
      margin: 100px auto;
      padding: 0 30px;
    }
    h1 {
      font-size: 56px;
      margin-bottom: 20px;
    }
    p {
      font-size: 20px;
      line-height: 1.7;
      color: #d4bdc8;
    }
    .label {
      color: #e5a1bd;
      font: 14px Arial, sans-serif;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <header>My Film Journal</header>
  <main>
    <div class="label">A PERSONAL FILM ARCHIVE</div>
    <h1>Welcome to My Film Journal.</h1>
    <p>
      A personal space dedicated to cinema,
      film reviews, rankings, and everything
      in between.
    </p>
  </main>
</body>
</html>
